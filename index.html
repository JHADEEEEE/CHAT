<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTalks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .message-bubble, .chat-list-item {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased">

    <div id="app" class="flex flex-col h-screen max-w-lg mx-auto">

        <!-- This container will hold the currently active view -->
        <div id="view-container" class="flex-1 flex flex-col min-h-0">

            <!-- ===== Public Chat View ===== -->
            <div id="public-chat-view" class="flex flex-col h-full p-2 sm:p-4">
                <header class="border-b-2 border-slate-700 pb-4 mb-4 flex items-center justify-between">
                    <div class="w-10"></div> <!-- Spacer -->
                    <div class="text-center">
                        <div class="mx-auto h-16 w-16 rounded-full bg-blue-600 flex items-center justify-center text-white text-3xl font-bold border-2 border-blue-500 shadow-lg">ACT</div>
                        <h1 class="text-3xl font-bold text-white mt-2">Public chat</h1>
                        <p class="text-sm text-slate-400 mt-2">
                            Your Anonymous ID: <span id="public-user-id" class="font-mono bg-slate-800 p-1 rounded-md text-xs">...</span>
                        </p>
                    </div>
                    <button id="inbox-btn" class="p-2 rounded-full hover:bg-slate-700 transition-colors relative">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <div id="inbox-notification-dot" class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-slate-900 hidden"></div>
                    </button>
                </header>
                <main id="public-chat-messages" class="flex-1 overflow-y-auto p-4 bg-slate-800 rounded-lg shadow-inner space-y-4 custom-scrollbar">
                    <div class="text-center text-slate-400">Connecting...</div>
                </main>
            </div>

            <!-- ===== Chat List View ===== -->
            <div id="chats-list-view" class="hidden flex-col h-full p-2 sm:p-4">
                 <header class="border-b-2 border-slate-700 pb-4 mb-4 flex items-center">
                    <button id="back-to-public-from-list-btn" class="p-2 rounded-full hover:bg-slate-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                    </button>
                    <h1 class="flex-1 text-xl font-bold text-center">Private Chats</h1>
                    <div class="w-10"></div> <!-- Spacer -->
                 </header>
                 <main id="chats-list-container" class="flex-1 overflow-y-auto p-2 space-y-2 custom-scrollbar">
                    <!-- Chat list items will be injected here -->
                 </main>
            </div>

            <!-- ===== Private Chat View ===== -->
            <div id="private-chat-view" class="hidden flex-col h-full p-2 sm:p-4">
                 <header class="border-b-2 border-slate-700 pb-4 mb-4 flex items-center">
                    <button id="back-to-chat-list-btn" class="p-2 rounded-full hover:bg-slate-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                    </button>
                    <div id="private-chat-header" class="flex-1 text-center"></div>
                    <div class="w-10"></div> <!-- Spacer -->
                 </header>
                 <main id="private-chat-messages" class="flex-1 overflow-y-auto p-4 bg-slate-800 rounded-lg shadow-inner space-y-4 custom-scrollbar"></main>
            </div>
        </div>

        <!-- ===== Shared Message Input Form ===== -->
        <footer class="p-2 sm:p-4 border-t-2 border-slate-700">
            <form id="message-form" class="flex items-center space-x-2">
                <input id="message-input" type="text" placeholder="Connecting..." autocomplete="off" class="flex-1 p-3 bg-slate-800 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition placeholder-slate-400" disabled>
                <button type="submit" id="send-button" class="bg-blue-600 text-white font-semibold p-3 rounded-lg hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Report Confirmation Modal -->
    <div id="report-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 rounded-lg shadow-2xl p-6 w-full max-w-sm text-center transform transition-all" style="animation: fadeIn 0.3s ease-out;">
            <h3 class="text-lg font-bold text-white mb-2">Report Message?</h3>
            <p class="text-slate-300 mb-6">Are you sure you want to report this message for review? This action cannot be undone.</p>
            <div class="flex justify-center gap-4">
                <button id="cancel-report-btn" class="px-6 py-2 bg-slate-600 hover:bg-slate-500 rounded-lg font-semibold transition-colors">Cancel</button>
                <button id="confirm-report-btn" class="px-6 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg font-semibold transition-colors">Report</button>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast-notification" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50">
        Message Reported
    </div>


    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, onSnapshot, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMH_fFA8MLPLR9ZZlSc8DoGLchLAt6j4A",
            authDomain: "lower-isarog-chat.firebaseapp.com",
            projectId: "lower-isarog-chat",
            storageBucket: "lower-isarog-chat.appspot.com",
            messagingSenderId: "920609089859",
            appId: "1:920609089859:web:bcb0a0cc66dc1786fba7f6"
        };
        
        // --- App State ---
        let currentView = 'public';
        let privateChatPartnerId = null;
        let currentUserId = null;
        let db, auth;
        let publicMessagesUnsubscribe = null;
        let chatListUnsubscribe = null;
        let privateMessagesUnsubscribe = null;
        let allLoadedMessages = []; // Holds messages for the current view, used for reporting
        let reportData = {}; // Temp holder for data of message being reported
        let toastTimer;


        // --- DOM Elements ---
        const views = {
            public: document.getElementById('public-chat-view'),
            chatsList: document.getElementById('chats-list-view'),
            private: document.getElementById('private-chat-view'),
        };
        const publicChatMessages = document.getElementById('public-chat-messages');
        const privateChatMessages = document.getElementById('private-chat-messages');
        const chatsListContainer = document.getElementById('chats-list-container');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const privateChatHeader = document.getElementById('private-chat-header');
        const inboxNotificationDot = document.getElementById('inbox-notification-dot');
        const publicUserIdElement = document.getElementById('public-user-id');
        const sendButton = document.getElementById('send-button');
        const reportModal = document.getElementById('report-modal');
        const cancelReportBtn = document.getElementById('cancel-report-btn');
        const confirmReportBtn = document.getElementById('confirm-report-btn');
        const toastNotification = document.getElementById('toast-notification');

        // --- Main Logic ---
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            onAuthStateChanged(auth, user => {
                if (user) onUserAuthenticated(user);
                else signInAnonymously(auth).catch(err => displayError(publicChatMessages, "Authentication failed."));
            });
        } catch (e) {
            displayError(publicChatMessages, "Failed to initialize the application.");
        }

        function onUserAuthenticated(user) {
            currentUserId = user.uid;
            publicUserIdElement.textContent = currentUserId;
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.placeholder = "Type your message...";
            listenForPublicMessages();
            listenForChatListChanges();
        }

        // --- View Management ---
        function showView(viewName) {
            currentView = viewName;
            Object.keys(views).forEach(key => {
                views[key].style.display = key === viewName ? 'flex' : 'none';
            });
            // Show/hide the form footer based on the view
            messageForm.style.display = viewName === 'chatsList' ? 'none' : 'flex';
        }
        
        showView('public'); // Set the initial view

        document.getElementById('inbox-btn').addEventListener('click', () => showView('chatsList'));
        document.getElementById('back-to-public-from-list-btn').addEventListener('click', () => showView('public'));
        document.getElementById('back-to-chat-list-btn').addEventListener('click', () => showView('chatsList'));

        // --- Notifications & Chat List Logic ---
        function listenForChatListChanges() {
            if (chatListUnsubscribe) chatListUnsubscribe();
            const q = query(collection(db, `users/${currentUserId}/chats`));

            chatListUnsubscribe = onSnapshot(q, (snapshot) => {
                const chats = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                chats.sort((a,b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
                renderChatList(chats);
                const hasUnread = chats.some(chat => chat.unread);
                inboxNotificationDot.style.display = hasUnread ? 'block' : 'none';
            });
        }

        function renderChatList(chats) {
            if (chats.length === 0) {
                chatsListContainer.innerHTML = `<div class="text-center text-slate-400 p-8">No private chats yet. Click a user's icon in the public chat to start one.</div>`;
                return;
            }
            chatsListContainer.innerHTML = chats.map(chat => {
                const userColor = getUserColor(chat.id);
                return `
                <div onclick="openPrivateChat('${chat.id}')" class="chat-list-item flex items-center p-3 rounded-lg hover:bg-slate-700 cursor-pointer transition-colors">
                    <div class="${userColor} w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold shadow-md">
                        ${chat.id.substring(0, 2).toUpperCase()}
                    </div>
                    <div class="flex-1 ml-4 overflow-hidden">
                        <p class="font-semibold truncate">~${chat.id.substring(0, 6)}</p>
                        <p class="text-sm text-slate-400 truncate">${chat.lastMessage || '...'}</p>
                    </div>
                    ${chat.unread ? `<div class="w-2.5 h-2.5 bg-red-500 rounded-full flex-shrink-0"></div>` : ''}
                </div>
                `;
            }).join('');
        }

        // --- Public & Private Chat Logic ---
        function listenForPublicMessages() {
            if (publicMessagesUnsubscribe) publicMessagesUnsubscribe();
            const q = query(collection(db, "public-chat"));
            publicMessagesUnsubscribe = onSnapshot(q, snapshot => renderMessages(snapshot, publicChatMessages), 
                err => displayError(publicChatMessages, "Lost connection."));
        }

        window.openPrivateChat = async (targetUserId) => {
            if (targetUserId === currentUserId) return;

            if (privateMessagesUnsubscribe) privateMessagesUnsubscribe();
            
            privateChatPartnerId = targetUserId;
            const userColor = getUserColor(targetUserId);
            privateChatHeader.innerHTML = `
                <div class="${userColor} w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold mx-auto mb-2 shadow-md">
                    ${targetUserId.substring(0, 2).toUpperCase()}
                </div>
                <p class="font-semibold text-lg">~${targetUserId.substring(0, 6)}</p>
            `;
            showView('private');

            // Mark chat as read
            const chatRef = doc(db, `users/${currentUserId}/chats`, targetUserId);
            const chatDoc = await getDoc(chatRef);
            if (chatDoc.exists() && chatDoc.data().unread) {
                await setDoc(chatRef, { unread: false }, { merge: true });
            }

            const chatId = [currentUserId, targetUserId].sort().join('_');
            const q = query(collection(db, `private-chats/${chatId}/messages`));
            privateMessagesUnsubscribe = onSnapshot(q, snapshot => renderMessages(snapshot, privateChatMessages), 
                err => displayError(privateChatMessages, "Could not load private chat."));
        }

        // --- Message Rendering & Submission ---
        messageForm.addEventListener('submit', async e => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.disabled = true;
            sendButton.disabled = true;

            const messageData = { text, userId: currentUserId, timestamp: serverTimestamp() };

            try {
                if (currentView === 'public') {
                    await addDoc(collection(db, "public-chat"), messageData);
                } else {
                    const chatId = [currentUserId, privateChatPartnerId].sort().join('_');
                    await addDoc(collection(db, `private-chats/${chatId}/messages`), messageData);
                    
                    const userChatRef = doc(db, `users/${currentUserId}/chats`, privateChatPartnerId);
                    const partnerChatRef = doc(db, `users/${privateChatPartnerId}/chats`, currentUserId);
                    await setDoc(userChatRef, { lastMessage: text, timestamp: serverTimestamp(), unread: false }, { merge: true });
                    await setDoc(partnerChatRef, { lastMessage: text, timestamp: serverTimestamp(), unread: true }, { merge: true });
                }
                messageInput.value = '';
            } catch (error) {
                console.error("Error sending message:", error);
            } finally {
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        });
        
        function renderMessages(snapshot, container) {
            const messages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            messages.sort((a, b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
            allLoadedMessages = messages; // Store for report functionality
            container.innerHTML = messages.length === 0
                ? `<div class="text-center text-slate-400 p-8">No messages yet.</div>`
                : messages.map(msg => getMessageHtml(msg)).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        function getMessageHtml(message) {
            const isCurrentUser = message.userId === currentUserId;
            
            const profileIcon = `
                <div onclick="openPrivateChat('${message.userId}')" class="${getUserColor(message.userId)} w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold text-xs cursor-pointer shadow-md hover:scale-110 transition-transform">
                    ${message.userId.substring(0, 2).toUpperCase()}
                </div>
            `;
            
            const reportButton = `
                <button onclick="showReportModal('${message.id}')" class="text-slate-500 hover:text-white p-1 opacity-0 group-hover:opacity-100 transition-opacity" title="Report message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                </button>
            `;

            const messageBubbleContent = `
                <div class="max-w-xs md:max-w-md p-3 rounded-2xl shadow-md ${isCurrentUser ? 'bg-blue-600 text-white rounded-br-none' : 'bg-slate-700 rounded-bl-none'}">
                    <p class="text-sm break-words">${escapeHTML(message.text)}</p>
                    ${message.timestamp ? `<p class="text-xs mt-1 opacity-70 ${isCurrentUser ? 'text-blue-200' : 'text-slate-400'} text-right">${message.timestamp.toDate().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</p>` : ''}
                </div>
            `;
            
            const messageContainerClasses = `flex items-end gap-2 group message-bubble`;
            
            if (isCurrentUser) {
                return `<div class="${messageContainerClasses} justify-end">${messageBubbleContent}</div>`;
            } else {
                const maybeProfileIcon = currentView === 'public' ? profileIcon : '<div class="w-8 h-8 flex-shrink-0"></div>';
                return `
                    <div class="${messageContainerClasses} justify-start">
                        ${maybeProfileIcon}
                        ${messageBubbleContent}
                        <div class="self-center">${reportButton}</div>
                    </div>
                `;
            }
        }

        // --- Report Logic ---
        window.showReportModal = (messageId) => {
            const message = allLoadedMessages.find(m => m.id === messageId);
            if (!message) {
                showToast("Cannot find message to report.", true);
                return;
            }
            reportData = { messageId: message.id, messageText: message.text, reportedUserId: message.userId };
            reportModal.classList.remove('hidden');
        };

        function hideReportModal() {
            reportModal.classList.add('hidden');
            reportData = {};
        }

        cancelReportBtn.addEventListener('click', hideReportModal);

        confirmReportBtn.addEventListener('click', async () => {
            if (!reportData.messageId) return;
            try {
                await addDoc(collection(db, "reports"), {
                    reportedByUserId: currentUserId,
                    reportedUserId: reportData.reportedUserId,
                    messageText: reportData.messageText,
                    originalMessageId: reportData.messageId,
                    timestamp: serverTimestamp(),
                    context: {
                        view: currentView,
                        chatId: currentView === 'public' ? 'public-chat' : [currentUserId, privateChatPartnerId].sort().join('_')
                    }
                });
                hideReportModal();
                showToast("Message reported. Thank you for your feedback.");
            } catch (error) {
                console.error("Error reporting message:", error);
                hideReportModal();
                showToast("Could not submit report.", true);
            }
        });

        // --- Utilities ---
        function getUserColor(userId) {
            const colors = ['bg-pink-500', 'bg-purple-500', 'bg-yellow-500', 'bg-indigo-500', 'bg-red-500', 'bg-teal-500', 'bg-orange-500'];
            let hash = 0;
            for (let i = 0; i < userId.length; i++) {
                hash = userId.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;','<': '&lt;','>': '&gt;',"'": '&#39;','"': '&quot;'}[tag]));
        }

        function showToast(message, isError = false) {
            toastNotification.textContent = message;
            toastNotification.className = `fixed bottom-24 left-1/2 -translate-x-1/2 text-white px-6 py-3 rounded-lg shadow-lg transition-opacity duration-300 z-50 ${isError ? 'bg-red-600' : 'bg-slate-800'}`;
            toastNotification.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastNotification.classList.add('opacity-0');
            }, 3000);
        }

        function displayError(container, text) {
             container.innerHTML = `<div class="text-center text-red-400 p-4">${text}</div>`;
             messageInput.disabled = true;
             messageInput.placeholder = "Chat disconnected";
             sendButton.disabled = true;
        }
    </script>
</body>
</html>
