<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="app" class="flex flex-col h-screen max-w-2xl mx-auto p-4">
        <!-- Header -->
        <header class="border-b-2 border-gray-200 dark:border-gray-700 pb-4 mb-4">
            <h1 class="text-3xl font-bold text-center text-gray-800 dark:text-white">chat</h1>
            <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-2">
                Your anonymous ID: <span id="userId" class="font-mono bg-gray-200 dark:bg-gray-700 p-1 rounded">...loading</span>
            </p>
        </header>

        <!-- Chat Messages -->
        <main id="chat-messages" class="flex-1 overflow-y-auto p-4 bg-white dark:bg-gray-800 rounded-lg shadow-inner space-y-4">
            <!-- Messages will be injected here by JavaScript -->
             <div class="text-center text-gray-500">Loading messages...</div>
        </main>

        <!-- Message Input -->
        <footer class="mt-4">
            <form id="message-form" class="flex items-center space-x-2">
                <input 
                    id="message-input" 
                    type="text" 
                    placeholder="Type your message..."
                    autocomplete="off"
                    class="flex-1 p-3 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <button 
                    type="submit" 
                    class="bg-blue-600 text-white font-semibold py-3 px-5 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900 transition-colors disabled:opacity-50"
                    id="send-button"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-send"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Firebase -->
    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        // These variables are provided by the environment.
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-chat-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- DOM Elements ---
        const userIdElement = document.getElementById('userId');
        const chatMessagesElement = document.getElementById('chat-messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        let db, auth;
        let currentUserId = null;

        // --- Main Application Logic ---
        try {
            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // Listen for authentication state changes
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    // User is signed in.
                    currentUserId = user.uid;
                    userIdElement.textContent = currentUserId;
                    
                    // User is authenticated, now we can listen for messages.
                    listenForMessages();
                } else {
                    // User is signed out. Attempt to sign in.
                    await authenticateUser();
                }
            });

        } catch (error) {
            console.error("Firebase initialization failed:", error);
            chatMessagesElement.innerHTML = `<div class="text-center text-red-500">Error: Could not connect to the chat service.</div>`;
        }

        /**
         * Authenticates the user either with a custom token or anonymously.
         */
        async function authenticateUser() {
             try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication failed:", error);
                userIdElement.textContent = "Error";
            }
        }


        /**
         * Sets up a real-time listener for chat messages from Firestore.
         */
        function listenForMessages() {
            const messagesCollectionPath = `/artifacts/${appId}/public/data/messages`;
            const q = query(collection(db, messagesCollectionPath), orderBy("timestamp"));

            onSnapshot(q, (querySnapshot) => {
                // Clear previous messages on new snapshot
                chatMessagesElement.innerHTML = '';
                if (querySnapshot.empty) {
                    chatMessagesElement.innerHTML = `<div class="text-center text-gray-500">No messages yet. Be the first to chat!</div>`;
                }

                querySnapshot.forEach(doc => {
                    const message = doc.data();
                    displayMessage(message);
                });

                // Scroll to the bottom of the chat
                chatMessagesElement.scrollTop = chatMessagesElement.scrollHeight;
            }, (error) => {
                console.error("Error listening to messages:", error);
                chatMessagesElement.innerHTML = `<div class="text-center text-red-500">Error: Could not load messages.</div>`;
            });
        }
        
        /**
         * Handles the submission of the message form.
         */
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = messageInput.value.trim();

            if (messageText.length === 0 || !currentUserId) {
                return;
            }

            // Disable form while sending
            messageInput.disabled = true;
            sendButton.disabled = true;

            const messagesCollectionPath = `/artifacts/${appId}/public/data/messages`;
            
            try {
                // Add a new message document to Firestore
                await addDoc(collection(db, messagesCollectionPath), {
                    text: messageText,
                    userId: currentUserId,
                    timestamp: serverTimestamp() // Use server-side timestamp
                });

                // Clear input field
                messageInput.value = '';

            } catch (error) {
                console.error("Error sending message:", error);
                // Optionally, show an error to the user in a non-alert way
            } finally {
                 // Re-enable form
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        });

        /**
         * Renders a single message in the chat window.
         * @param {object} message - The message object from Firestore.
         */
        function displayMessage(message) {
            if (!message.text) return;

            const isCurrentUser = message.userId === currentUserId;

            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex ${isCurrentUser ? 'justify-end' : 'justify-start'}`;

            const messageBubble = document.createElement('div');
            messageBubble.className = `max-w-xs md:max-w-md lg:max-w-lg px-4 py-2 rounded-2xl shadow`;
            
            const messageText = document.createElement('p');
            messageText.className = 'text-sm';
            messageText.textContent = message.text;

            const userIdText = document.createElement('p');
            userIdText.className = `text-xs mt-1 ${isCurrentUser ? 'text-right' : 'text-left'}`;
            // Use a shorter, more readable version of the UID for display
            userIdText.textContent = `~${message.userId.substring(0, 6)}`;
            
            if (isCurrentUser) {
                messageBubble.classList.add('bg-blue-600', 'text-white');
                userIdText.classList.add('text-blue-200');
            } else {
                messageBubble.classList.add('bg-gray-200', 'dark:bg-gray-700', 'text-gray-800', 'dark:text-gray-200');
                userIdText.classList.add('text-gray-400', 'dark:text-gray-500');
            }

            messageBubble.appendChild(messageText);
            messageBubble.appendChild(userIdText);
            messageWrapper.appendChild(messageBubble);

            chatMessagesElement.appendChild(messageWrapper);
        }

    </script>
</body>
</html>
